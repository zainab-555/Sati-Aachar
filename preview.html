      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [selectedWeights, setSelectedWeights] = useState({
        "aam-ka-aachar": "500g",
        "lal-mirch-bharwa": "500g",
        "lahsun-ka-aachar": "500g",
        "mishrit-aachar": "500g",
        "ankurit-methi": "500g",
        "apple-cider-vinegar": "500ml",
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (product) => {
        const weight = selectedWeights[product.id] || product.variants[0].weight;
        const variant = product.variants.find((v) => v.weight === weight) || product.variants[0];
        const key = `${product.id}-${weight}`;

        setCart((prev) => {
          const exists = prev.find((i) => i.key === key);
          if (exists) {
            return prev.map((i) => i.key === key ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { key, productId: product.id, title: product.title, weight, price: variant.price, image: product.image, quantity: 1 }];
        });
        showToast(`${product.title} (${weight}) basket me add ho gaya!`);
      };

      const updateQty = (key, delta) => {
        setCart((prev) => prev.map((i) => i.key === key ? { ...i, quantity: i.quantity + delta } : i).filter((i) => i.quantity > 0));
      };

      const cartCount = cart.reduce((s, i) => s + i.quantity, 0);
      const cartTotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);

      const filtered = PRODUCTS_DATA.filter((p) => {
        const matchesCat = selectedCategory === "all" || p.category === selectedCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || p.title.toLowerCase().includes(q) || p.englishTitle.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col bg-[#fdfbf7]">
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-emerald-950 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 border border-emerald-800">

                const weight = selectedWeights[product.id] || product.variants[0].weight;
                const variant = product.variants.find((v) => v.weight === weight) || product.variants[0];

                return (

                      <div className="relative aspect-square w-full bg-stone-50 rounded-2xl overflow-hidden flex items-center justify-center p-4 mb-4">

                        <span className="absolute bottom-3 left-3 bg-red-600 text-white font-black text-[10px] px-2 py-0.5 rounded">

                        </span>
                      </div>

                      <div className="flex items-center space-x-1 text-amber-500 text-xs font-bold mb-1">

                        <span className="text-stone-400 font-normal">({product.reviewsCount})</span>

                      <h3 className="font-serif font-bold text-lg text-stone-900 leading-snug">{product.title}</h3>
                      <p className="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
                    </div>

                    <div className="mt-4 pt-3 border-t border-stone-100">
                      <div className="grid grid-cols-3 gap-1.5 mb-3">
                        {product.variants.map((v) => (
                          <button
                            key={v.weight}
                            onClick={() => setSelectedWeights({ ...selectedWeights, [product.id]: v.weight })}
                            className={`py-1 text-xs font-bold rounded-xl border ${
                              weight === v.weight ? "bg-emerald-950 text-white border-emerald-950" : "bg-stone-50 text-stone-600 border-stone-200"
                            }`}
                          >
                            {v.weight}
                          </button>
                        ))}
                      </div>

                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-xl font-black text-stone-900">₹{variant.price}</span>
                          <span className="text-xs text-stone-400 line-through ml-1.5">₹{variant.originalPrice}</span>
                        </div>

                        {inCart ? (
                          <div className="flex items-center space-x-2 bg-emerald-950 text-white rounded-full px-2.5 py-1 text-xs font-bold">
                            <button onClick={() => updateQty(inCart.key, -1)} className="px-1">-</button>
                            <span>{inCart.quantity}</span>
                            <button onClick={() => updateQty(inCart.key, 1)} className="px-1">+</button>
                          </div>
                        ) : (
                          <button
                            onClick={() => addToCart(product)}
                            className="bg-emerald-950 text-white text-xs font-bold px-4 py-2 rounded-full hover:bg-black shadow"
                          >
                            Add to Cart
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex justify-end">
              <div className="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
                <div>

                    <button onClick={() => setIsCartOpen(false)} className="text-stone-500 font-bold">✕ Close</button>
                  </div>
                  <div className="py-4 space-y-3 max-h-[60vh] overflow-y-auto">
                    {cart.map((item) => (
                      <div key={item.key} className="flex items-center space-x-3 p-2 bg-stone-50 rounded-xl border">
                        <img src={item.image} alt={item.title} className="w-12 h-12 object-contain bg-white rounded p-1" />
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-xs truncate">{item.title}</p>
                          <p className="text-[10px] text-stone-500">{item.weight} • ₹{item.price}</p>
                        </div>
                        <div className="flex items-center space-x-1 font-bold text-xs">
                          <button onClick={() => updateQty(item.key, -1)} className="px-1.5 bg-stone-200 rounded">-</button>
                          <span>{item.quantity}</span>
                          <button onClick={() => updateQty(item.key, 1)} className="px-1.5 bg-stone-200 rounded">+</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-4 border-t space-y-3">
                  <div className="flex justify-between font-bold text-base">
                    <span>कुल योग (Total):</span>
                    <span>₹{cartTotal}</span>
                  </div>
                  <button
                    onClick={() => {
                      alert("धन्यवाद! आपका सती अचार ऑर्डर कन्फर्म हो गया है!");
                      setCart([]);
                      setIsCartOpen(false);
                    }}
                    className="w-full bg-emerald-950 text-white font-bold py-3 rounded-full text-sm hover:bg-black"
                  >
                    Proceed to Checkout
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-stone-900 text-stone-400 py-8 text-center text-xs">
            <p className="text-white font-bold mb-1">Sati Aachar • Home Made & Pure Pickles</p>
            <p>© 2026 Sati Aachar. All rights reserved. "टेस्ट किया क्या?"</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
